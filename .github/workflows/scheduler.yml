name: Post news carousel (scheduler check)

on:
  schedule:
    # Every 20 minutes. daily_scheduler.py's MIN_GAP_MINUTES (25) means
    # checking more often than that buys nothing anyway - a post can't
    # fire closer together than that regardless. This interval keeps
    # monthly minutes comfortably under GitHub's 2,000 free min/month
    # budget for PRIVATE repos (public repos have no cap).
    # NOTE: GitHub Actions cron times are UTC. Adjust PEAK_WINDOWS in
    # daily_scheduler.py to your local timezone offset if it matters to you.
    - cron: "*/20 * * * *"
  workflow_dispatch: {}  # lets you trigger a manual check-run from the Actions tab

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"  # skips re-downloading the same wheels every 20 min - meaningfully cuts per-run minutes

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check schedule and post if due
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python daily_scheduler.py --check-once
