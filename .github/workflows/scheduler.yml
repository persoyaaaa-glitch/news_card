name: Post news carousel (scheduler check)

on:
  schedule:
    # Every 30 minutes. GitHub Actions bills each job a MINIMUM of 1
    # minute even if it finishes in a few seconds, so the check-in
    # frequency itself - not just how often a post actually fires - is
    # the main driver of monthly Actions minutes on a private repo's
    # free 2,000 min/month budget.
    #
    # Each tick does four things in order:
    #   1. Ensure today's schedule exists (created once, right after
    #      the first tick past midnight IST - see
    #      _ensure_today_schedule_remote in daily_scheduler.py). This is
    #      also what pushes the bare timestamps to the companion PWA.
    #   2. Build content for any slot within ~30 min of its post time
    #      that isn't built yet (content_pregen.py).
    #   3. Post the earliest due, non-Manual-flagged slot, if any
    #      (daily_scheduler.py --check-once). Manual-flagged slots are
    #      checked against the real IG feed instead of auto-posted.
    #   4. Send push notifications: the once-a-day "schedule's ready"
    #      alert, and each slot's 15-minutes-before alert.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # lets you trigger a check manually from the Actions tab

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"  # skips re-downloading the same wheels every run - meaningfully cuts per-run minutes

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build content for any slot coming up soon
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python content_pregen.py

      - name: Check schedule and post if due
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: python daily_scheduler.py --check-once

      - name: Send push notifications (schedule-ready + 15-min-before)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python send_notifications.py
